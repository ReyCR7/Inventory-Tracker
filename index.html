<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%}
:root {
  /* Matte Black & Cyberpunk Cyber Colors */
  --bg:#030712;--bg2:#0B0F19;--bg3:#111827;--bg4:#1F2937;
  --surface:#0F172A;--surface2:#1E293B;--surface3:#334155;
  --border:#1E293B;--border2:#475569;
  --accent:#38BDF8;/* Neon Blue */
  --accent2:#A855F7;/* Neon Purple */
  --accentglow:rgba(56,189,248,0.2);
  --gold:#F5C842;--goldglow:rgba(245,200,66,0.12);
  --green:#10B981;--red:#EF4444;--orange:#F97316;--purple:#C084FC;
  --text:#F8FAFC;--text2:#94A3B8;--text3:#64748B;
  --font-head:'Orbitron', sans-serif;/* Your Cool New Font Hook! */
  --font-body:'DM Sans',sans-serif;
  --r:12px;--r2:8px;--r3:20px;
  --shadow:0 4px 24px rgba(0,0,0,0.6);--shadow2:0 8px 40px rgba(0,0,0,0.8);
}
.light-theme {
  --bg: #F4F7FC;
  --bg2: #FFFFFF;
  --bg3: #EBF1FA;
  --bg4: #DFE7F3;
  --surface: #FFFFFF;
  --surface2: #F0F4FC;
  --surface3: #E2EAF8;
  --border: #D0DBEA;
  --border2: #BFCFEE;
  --text: #1E293B;
  --text2: #64748B;
  --text3: #94A3B8;
  --shadow: 0 4px 24px rgba(148, 163, 184, 0.15);
  --shadow2: 0 8px 40px rgba(148, 163, 184, 0.25);
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);width:100%;min-height:100vh;height:100%;overflow-x:hidden}
input,select,textarea,button{font-family:var(--font-body)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.glass{background:rgba(20,29,46,0.7);backdrop-filter:blur(20px);border:1px solid var(--border)}
.glow-accent{box-shadow:0 0 0 1px var(--accent),0 0 20px var(--accentglow)}
.glow-gold{box-shadow:0 0 0 1px var(--gold),0 0 20px var(--goldglow)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.tag-open{background:rgba(79,142,247,.15);color:#6aa3ff;border:1px solid rgba(79,142,247,.3)}
.tag-progress{background:rgba(245,200,66,.12);color:#F5C842;border:1px solid rgba(245,200,66,.3)}
.tag-resolved{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.tag-critical{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.tag-high{background:rgba(249,115,22,.12);color:#fb923c;border:1px solid rgba(249,115,22,.3)}
.tag-medium{background:rgba(245,200,66,.12);color:#F5C842;border:1px solid rgba(245,200,66,.3)}
.tag-low{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r2);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;letter-spacing:.3px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(79,142,247,.4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accentglow)}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-gold{background:var(--gold);color:#1a1400;font-weight:600}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.inp{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 14px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentglow)}
.inp::placeholder{color:var(--text3)}
.inp-area{resize:vertical;min-height:90px}
select.inp option{background:var(--bg3)}
.lbl{font-size:11.5px;color:var(--text2);font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px;display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .2s}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-lg{max-width:780px}
.modal-head{padding:24px 28px 0;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:0}
.modal-body{padding:24px 28px}
.modal-foot{padding:16px 28px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r2);cursor:pointer;transition:all .2s;font-size:13.5px;color:var(--text2);font-weight:400;white-space:nowrap}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accentglow);color:var(--accent);font-weight:500;border:1px solid rgba(79,142,247,.2)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;filter:blur(30px);opacity:.4}
.stat-card.blue::before{background:var(--accent)}
.stat-card.gold::before{background:var(--gold)}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}
.stat-card.purple::before{background:var(--purple)}
.stat-num{font-family:var(--font-head);font-size:36px;font-weight:700;line-height:1;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid var(--border2);background:var(--surface)}
.avatar-lg{width:58px;height:58px;font-size:30px;border-width:2px}
.avatar-sm{width:30px;height:30px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text2)}
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r);padding:14px 20px;font-size:13.5px;box-shadow:var(--shadow2);animation:slideUp .3s;max-width:340px}
.toast.success{border-color:rgba(34,197,94,.4);color:#4ade80}
.toast.error{border-color:rgba(239,68,68,.4);color:#f87171}
.progress-bar{height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-gap{display:flex;align-items:center;gap:10px}
.flex-col{display:flex;flex-direction:column;gap:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid rgba(30,45,72,.5);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,142,247,.03)}
.bitmoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bitmoji-opt{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:2px solid transparent;transition:all .2s;background:var(--surface2)}
.bitmoji-opt:hover{border-color:var(--accent);transform:scale(1.1)}
.bitmoji-opt.selected{border-color:var(--gold);background:var(--goldglow);box-shadow:0 0 12px var(--goldglow)}
.search-inp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:9px 14px 9px 38px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s;width:240px}
.search-inp:focus{border-color:var(--accent)}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.timeline-item{display:flex;gap:14px;padding-bottom:18px;position:relative}
.timeline-item::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--border)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:2px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:13px;margin-top:6px}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:4px;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto}
.main-area{margin-left:240px;flex:1;width:calc(100% - 240px);min-height:100vh;padding:28px 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--font-head);font-size:22px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:8px;margin-bottom:24px;padding:0 4px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.section-head{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.section-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r2);margin-top:8px}
.file-drop{border:2px dashed var(--border2);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text3)}
.file-drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accentglow)}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{font-size:12px;color:var(--text2);width:90px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:24px;background:var(--surface2);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .8s ease;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.donut-leg-item{display:flex;align-items:center;gap:8px;font-size:12px}
.donut-dot{width:10px;height:10px;border-radius:2px}
.notif-badge{background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.animate-in{animation:slideIn .3s ease}
.pulse{animation:pulse 2s infinite}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.auth-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(79,142,247,.08) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 80% 80%,rgba(168,85,247,.05) 0%,transparent 60%)}
.auth-card{width:100%;max-width:440px;position:relative;z-index:1}
.auth-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px;gap:4px;margin-bottom:28px}
.auth-tab{flex:1;padding:9px;text-align:center;border-radius:var(--r2);cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;color:var(--text2)}
.auth-tab.active{background:var(--accent);color:#fff}
.landing{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;padding:40px}
.landing-bg{position:absolute;inset:0;background:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(79,142,247,.1) 0%,transparent 65%),radial-gradient(circle at 20% 80%,rgba(168,85,247,.06) 0%,transparent 40%),radial-gradient(circle at 80% 20%,rgba(245,200,66,.04) 0%,transparent 40%)}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.3;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%)}
.landing h1{font-family:var(--font-head);font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-3px;line-height:1.05;margin-bottom:20px}
.landing h1 span{background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.landing p{font-size:18px;color:var(--text2);max-width:560px;line-height:1.6;margin-bottom:40px;font-weight:300}
.landing-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn-large{padding:14px 32px;font-size:15px;border-radius:var(--r)}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:860px;margin-top:70px}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;text-align:left}
.feature-icon{font-size:28px;margin-bottom:14px}
.feature-card h3{font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:6px}
.feature-card p{font-size:13px;color:var(--text2);line-height:1.6}
.device-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s;cursor:default}
.device-card:hover{border-color:var(--accent)}
.device-icon{font-size:32px;margin-bottom:4px}
.ticket-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.ticket-row:hover{border-color:var(--border2);background:var(--surface2)}
@media(max-width:900px){
  .sidebar{width:200px}
  .main-area{margin-left:200px;width:calc(100% - 200px);padding:20px}
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
  .feature-grid{grid-template-columns:1fr 1fr}
}
/* Premium Floating Form Interactive Styles */
.form-group {
  position: relative;
  margin-bottom: 22px;
  width: 100%;
}
.floating-inp {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r2);
  padding: 14px 16px 10px 16px; /* Shifted down for room */
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.floating-inp:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accentglow);
  background: var(--bg2);
}
.floating-lbl {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text3);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  text-transform: none; /* Soft lowercase look */
  letter-spacing: 0px;
}
/* Magically shrink and push label up when active or filled */
.floating-inp:focus ~ .floating-lbl,
.floating-inp:not(:placeholder-shown) ~ .floating-lbl {
  top: 12px;
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
}
.pass-toggle-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--text3);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
  z-index: 10;
}
.pass-toggle-btn:hover {
  color: var(--accent);
}
.auth-card-premium {
  box-shadow: var(--shadow2);
  border: 1px solid var(--border);
  border-radius: var(--r3) !important;
  transition: all 0.3s ease;
  overflow: hidden;
}
</style>

<div id="root" style="width:100%;min-height:100vh"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const BITMOJIS=['😀','😎','🤓','🥳','😏','🤩','🧑‍💻','👩‍💼','👨‍💼','🧑‍🔬','👩‍🎨','🧑‍🚀','🦸','🧙','🥷','🤖','👾','🎭','🦊','🐺','🦁','🐯','🦅','🦋','🐬','🦄','🌟','⚡','🔥','💎','🎯','🏆'];
const PRIORITIES=['Low','Medium','High','Critical'];
const ISSUE_CATEGORIES=['Hardware Failure','Software Issue','Connectivity','Performance','Display','Battery','Keyboard/Mouse','Other'];
const DEVICE_TYPES=['Laptop','Desktop','Monitor','Printer','Scanner','Phone','Tablet','Server','Router','Switch','UPS','Camera','Projector','Other'];

function generateId(){return Math.random().toString(36).slice(2,9).toUpperCase();}
function today(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function now(){return new Date().toLocaleString('en-IN',{hour12:false});}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}

const INITIAL_DATA = {
  company: {
    name: 'My Organization',
    logo: '🏢',
    branches: []
  },
  users: [],
  admins: [],
  devices: [],
  tickets: []
};

// Initialize Supabase Cloud Connection
const SUPABASE_URL = "https://wyvjwimnsmtcrbpfulnc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UMOcAy_cYhffkigLkNKwCA_rn02_mhi";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  

async function loadDataFromCloud() {
  try {
    const [branchesRes, usersRes, devicesRes, ticketsRes, commentsRes] = await Promise.all([
      supabaseClient.from('branches').select('*'),
      supabaseClient.from('users').select('*'),
      supabaseClient.from('devices').select('*'),
      supabaseClient.from('tickets').select('*'),
      supabaseClient.from('ticket_comments').select('*')
    ]);

    const rawBranches = branchesRes.data || [];
    const rawUsers = usersRes.data || [];
    const rawDevices = devicesRes.data || [];
    const rawTickets = ticketsRes.data || [];
    const rawComments = commentsRes.data || [];

    // Parse and map data structures back into frontend state context format
    const branches = rawBranches.map(b => ({ id: b.branch_id, name: b.name, country: b.country, state: b.state }));
    const users = rawUsers.filter(u => u.role !== 'admin').map(u => ({ id: u.user_id, branch: u.branch_id, name: u.name, email: u.email, password: u.password_hash, role: u.role, bitmoji: u.bitmoji, department: u.department, designation: u.designation, doj: u.doj, phone: u.phone, employeeId: u.employee_id, active: u.is_active }));
    const admins = rawUsers.filter(u => u.role === 'admin').map(u => ({ id: u.user_id, branch: u.branch_id, name: u.name, email: u.email, password: u.password_hash, role: u.role, bitmoji: u.bitmoji, department: u.department, designation: u.designation, doj: u.doj, phone: u.phone, employeeId: u.employee_id, active: u.is_active }));
    const devices = rawDevices.map(d => ({ id: d.device_id, branch: d.branch_id, assignedTo: d.assigned_to, name: d.name, type: d.type, brand: d.brand, model: d.model, serial: d.serial, color: d.color, buyDate: d.buy_date, warranty: d.warranty_expiry, warrantyCard: d.warranty_card, status: d.status, price: d.price }));
    const tickets = rawTickets.map(t => ({
      id: t.ticket_id,
      raisedBy: t.raised_by,
      device: t.device_id,
      resolvedBy: t.resolved_by,
      title: t.title,
      category: t.category,
      priority: t.priority,
      status: t.status,
      description: t.description,
      raisedDate: t.raised_date,
      resolvedDate: t.resolved_date,
      resolutionNote: t.resolution_note,
      comments: rawComments.filter(c => c.ticket_id === t.ticket_id).map(c => ({ by: c.by_user_id, text: c.comment_text, date: c.created_at || new Date().toISOString() })),
      branch: t.branch_id
    }));

    return {
      company: { name: 'AssetX Corp', logo: '🏢', branches },
      users,
      admins,
      devices,
      tickets
    };
  } catch (err) {
    console.error("Failed to fetch startup data from cloud database:", err);
    return INITIAL_DATA;
  }
}

async function saveRecordToCloud(tableName, recordData) {
  try {
    const { error } = await supabaseClient.from(tableName).upsert(recordData);
    if (error) throw error;
  } catch (e) {
    console.error("Database sync failed:", e.message);
  }
}

async function deleteRecordFromCloud(tableName, primaryKeyName, targetId) {
  try {
    const { error } = await supabaseClient
      .from(tableName)
      .delete()
      .eq(primaryKeyName, targetId);
    if (error) throw error;
  } catch (e) {
    console.error("Database deletion failed:", e.message);
  }
}  

// Theme Switcher Component
function ThemeToggle() {
  const [isLight, setIsLight] = useState(() => document.body.classList.contains('light-theme'));

  const toggleTheme = () => {
    if (document.body.classList.contains('light-theme')) {
      document.body.classList.remove('light-theme');
      setIsLight(false);
    } else {

// Toast
let toastFn=null;
function Toast(){
  const[toasts,setToasts]=useState([]);
  toastFn=(msg,type='success')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
  };
  return <div style={{position:'fixed',bottom:24,right:24,zIndex:9999,display:'flex',flexDirection:'column',gap:8}}>
    {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.type==='success'?'✓ ':t.type==='error'?'✕ ':''}{t.msg}</div>)}
  </div>;
}
function toast(m,t){if(toastFn)toastFn(m,t);}

// ─── DONUT CHART (SVG) ──────────────────────────────────────────
function DonutChart({data}){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let cum=0;
  const r=50,cx=60,cy=60,stroke=18;
  const slices=data.map(d=>{
    const pct=d.value/total;
    const start=cum;
    cum+=pct;
    const a1=2*Math.PI*start-Math.PI/2;
    const a2=2*Math.PI*(start+pct)-Math.PI/2;
    const laf=pct>0.5?1:0;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return{...d,d:`M ${x1} ${y1} A ${r} ${r} 0 ${laf} 1 ${x2} ${y2}`};
  });
  return <div className="donut-wrap">
    <svg width={120} height={120}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface2)" strokeWidth={stroke}/>
      {slices.map((s,i)=><path key={i} d={s.d} fill="none" stroke={s.color} strokeWidth={stroke} strokeLinecap="round"/>)}
      <text x={cx} y={cy+5} textAnchor="middle" fontSize={13} fontWeight="600" fill="var(--text)">{total}</text>
    </svg>
    <div className="donut-legend">
      {data.map((d,i)=><div key={i} className="donut-leg-item">
        <div className="donut-dot" style={{background:d.color}}/>
        <span style={{color:'var(--text2)'}}>{d.label}</span>
        <span style={{fontWeight:500}}>{d.value}</span>
      </div>)}
    </div>
  </div>;
}

// ─── TICKET MODAL ────────────────────────────────────────────────
function TicketModal({data,ticket,currentUser,onSave,onClose}){
  const isAdmin=currentUser.role==='admin';
  const[comment,setComment]=useState('');
  const allUsers=[...data.users,...data.admins];
  const raiser=allUsers.find(u=>u.id===ticket.raisedBy);
  const resolver=ticket.resolvedBy?allUsers.find(u=>u.id===ticket.resolvedBy):null;
  const device=data.devices.find(d=>d.id===ticket.device);

  const addComment=()=>{
    if(!comment.trim())return;
    const updated={...ticket,comments:[...ticket.comments,{by:currentUser.id,text:comment,date:new Date().toISOString()}]};
    const tickets=data.tickets.map(t=>t.id===ticket.id?updated:t);
    onSave({...data,tickets});
    setComment('');
    toast('Comment added!');
  };

  const changeStatus=st=>{
    const updated={...ticket,status:st,...(st==='Resolved'?{resolvedBy:currentUser.id,resolvedDate:new Date().toISOString()}:{})};
    const tickets=data.tickets.map(t=>t.id===ticket.id?updated:t);
    onSave({...data,tickets});
    toast(`Ticket marked as ${st}`);
  };

  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
      <div className="modal-head">
        <div className="flex-between" style={{flexWrap:'wrap',gap:8}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <h2 style={{fontFamily:'var(--font-head)',fontSize:18,fontWeight:700}}>{ticket.title}</h2>
            </div>
            <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
              <span className={`tag tag-${ticket.status.toLowerCase().replace(' ','-')}`}>{ticket.status}</span>
              <span className={`tag tag-${ticket.priority.toLowerCase()}`}>{ticket.priority}</span>
              <span className="chip">#{ticket.id}</span>
            </div>
          </div>
          {isAdmin&&ticket.status!=='Resolved'&&<div style={{display:'flex',gap:8}}>
            {ticket.status==='Open'&&<button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>changeStatus('In Progress')}>▶ Start</button>}
            <button className="btn btn-primary" style={{fontSize:12}} onClick={()=>changeStatus('Resolved')}>✓ Resolve</button>
          </div>}
        </div>
      </div>
      <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:18}}>
        <div className="grid-2">
          <div className="card" style={{padding:14}}>
            <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:8}}>Ticket Info</p>
            <div style={{display:'flex',flexDirection:'column',gap:6,fontSize:13}}>
              <div className="flex-between"><span style={{color:'var(--text2)'}}>Category</span><span>{ticket.category}</span></div>
              <div className="flex-between"><span style={{color:'var(--text2)'}}>Raised On</span><span>{fmtDate(ticket.raisedDate)}</span></div>
              <div className="flex-between"><span style={{color:'var(--text2)'}}>Device</span><span>{device?.name||'—'}</span></div>
              {resolver&&<div className="flex-between"><span style={{color:'var(--text2)'}}>Resolved By</span><span>{resolver.name}</span></div>}
              {ticket.resolvedDate&&<div className="flex-between"><span style={{color:'var(--text2)'}}>Resolved On</span><span>{fmtDate(ticket.resolvedDate)}</span></div>}
            </div>
          </div>
          <div className="card" style={{padding:14}}>
            <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:8}}>Raised By</p>
            {raiser&&<div className="flex-gap">
              <div className="avatar avatar-sm">{raiser.bitmoji}</div>
              <div>
                <p style={{fontWeight:500,fontSize:13}}>{raiser.name}</p>
                <p style={{fontSize:11,color:'var(--text3)'}}>{raiser.department} • {raiser.designation}</p>
              </div>
            </div>}
          </div>
        </div>
        <div>
          <p style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>Description</p>
          <p style={{fontSize:13.5,lineHeight:1.6,color:'var(--text)'}}>{ticket.description}</p>
        </div>
        {ticket.images?.length>0&&<div>
          <p style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>Attached Images</p>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {ticket.images.map((img,i)=><img key={i} src={img.url} alt={img.name} style={{height:90,borderRadius:'var(--r2)',border:'1px solid var(--border)',cursor:'pointer'}} onClick={()=>window.open(img.url)}/>)}
          </div>
        </div>}
        {ticket.resolutionNote&&<div style={{background:'rgba(34,197,94,.08)',border:'1px solid rgba(34,197,94,.2)',borderRadius:'var(--r2)',padding:'12px 14px'}}>
          <p style={{fontSize:11,color:'#4ade80',marginBottom:4}}>RESOLUTION NOTE</p>
          <p style={{fontSize:13}}>{ticket.resolutionNote}</p>
        </div>}
        <hr className="divider"/>
        <div>
          <p style={{fontSize:13,fontWeight:500,marginBottom:12}}>Comments ({ticket.comments.length})</p>
          {ticket.comments.map((c,i)=>{
            const u=allUsers.find(x=>x.id===c.by);
            return <div key={i} style={{display:'flex',gap:10,marginBottom:14}}>
              <div className="avatar avatar-sm">{u?.bitmoji||'?'}</div>
              <div style={{flex:1}}>
                <div className="flex-between" style={{marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:500}}>{u?.name||'Unknown'}</span>
                  <span style={{fontSize:11,color:'var(--text3)'}}>{fmtDate(c.date)}</span>
                </div>
                <p style={{fontSize:13,color:'var(--text2)',lineHeight:1.5}}>{c.text}</p>
              </div>
            </div>;
          })}
          {ticket.comments.length===0&&<p style={{fontSize:13,color:'var(--text3)'}}>No comments yet.</p>}
          <div style={{display:'flex',gap:10,marginTop:14}}>
            <input className="inp" value={comment} onChange={e=>setComment(e.target.value)} placeholder="Add a comment..." onKeyDown={e=>e.key==='Enter'&&addComment()}/>
            <button className="btn btn-primary" onClick={addComment}>Send</button>
          </div>
        </div>
      </div>
      <div className="modal-foot">
        <button className="btn btn-ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  </div>;
}

// ─── ASSIGN DEVICE MODAL ─────────────────────────────────────────
function AssignDeviceModal({data,device,onSave,onClose}){
  const[userId,setUserId]=useState('');
  const allUsers=[...data.users,...data.admins];
  const unassign=()=>{
    const devs=data.devices.map(d=>{
      if(d.id!==device.id)return d;
      const history=d.history.map(h=>h.user===d.assignedTo&&!h.to?{...h,to:now()}:h);
      return{...d,status:'Available',assignedTo:null,assignedDate:null,history};
    });
    onSave({...data,devices:devs});
    toast('Device unassigned.');
    onClose();
  };
  const assign=()=>{
    if(!userId){toast('Please select a user.','error');return;}
    const devs=data.devices.map(d=>{
      if(d.id!==device.id)return d;
      const history=[...d.history.map(h=>h.user===d.assignedTo&&!h.to?{...h,to:now()}:h),{user:userId,from:now(),to:null}];
      return{...d,status:'Assigned',assignedTo:userId,assignedDate:now(),history};
    });
    onSave({...data,devices:devs});
    const u=allUsers.find(x=>x.id===userId);
    toast(`Device assigned to ${u?.name}!`);
    onClose();
  };
  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h2 style={{fontFamily:'var(--font-head)',fontSize:20,fontWeight:700}}>🔗 Assign Device</h2></div>
      <div className="modal-body">
        <div className="card" style={{padding:14,marginBottom:16}}>
          <p style={{fontWeight:500}}>{device.name}</p>
          <p style={{fontSize:12,color:'var(--text3)'}}>S/N: {device.serial} • {device.type}</p>
        </div>
        <label className="lbl">Assign To</label>
        <select className="inp" value={userId} onChange={e=>setUserId(e.target.value)}>
          <option value="">— Select User —</option>
          {allUsers.map(u=><option key={u.id} value={u.id}>{u.name} — {u.department} ({u.role})</option>)}
        </select>
        {device.assignedTo&&<div style={{marginTop:14,background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',borderRadius:'var(--r2)',padding:'12px 14px'}}>
          <p style={{fontSize:12,color:'var(--text2)'}}>Currently assigned to: <strong>{allUsers.find(u=>u.id===device.assignedTo)?.name}</strong></p>
          <button className="btn btn-danger" style={{marginTop:8,fontSize:12}} onClick={unassign}>Unassign Device</button>
        </div>}
      </div>
      <div className="modal-foot">
        <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" onClick={assign}>Assign</button>
      </div>
    </div>
  </div>;
}

// ─── ADMIN DASHBOARD ─────────────────────────────────────────────
function AdminDashboard({data,currentUser}){
  const tickets=data.tickets;
  const devices=data.devices;
  const open=tickets.filter(t=>t.status==='Open').length;
  const inprog=tickets.filter(t=>t.status==='In Progress').length;
  const resolved=tickets.filter(t=>t.status==='Resolved').length;
  const critical=tickets.filter(t=>t.priority==='Critical'&&t.status!=='Resolved').length;
  const available=devices.filter(d=>d.status==='Available').length;
  const assigned=devices.filter(d=>d.status==='Assigned').length;
  const expiring=devices.filter(d=>{if(!d.warranty)return false;const exp=new Date(d.warranty);const diff=(exp-new Date())/(1000*60*60*24*30);return diff>0&&diff<3;}).length;

  const resolverCounts={};
  tickets.filter(t=>t.resolvedBy).forEach(t=>{resolverCounts[t.resolvedBy]=(resolverCounts[t.resolvedBy]||0)+1;});
  const topAdmins=[...data.admins].map(a=>({label:a.name,value:resolverCounts[a.id]||0})).sort((a,b)=>b.value-a.value);
  const categoryData=ISSUE_CATEGORIES.map(c=>({label:c,value:tickets.filter(t=>t.category===c).length})).filter(x=>x.value>0);
  const branchTickets=data.company.branches.map(b=>({label:b.name.split('—')[0].trim(),value:tickets.filter(t=>t.branch===b.id).length}));
  const recentTickets=tickets.slice().sort((a,b)=>new Date(b.raisedDate)-new Date(a.raisedDate)).slice(0,5);
  const allUsers=[...data.users,...data.admins];
  return <div>
    <div className="topbar">
      <div><div className="section-head">Dashboard Overview</div><div className="section-sub">Welcome back, {currentUser.name} • {today()}</div></div>
      {critical>0&&<div style={{background:'rgba(239,68,68,.12)',border:'1px solid rgba(239,68,68,.3)',borderRadius:'var(--r)',padding:'10px 16px',display:'flex',alignItems:'center',gap:8}}>
        <span className="pulse">🔴</span><span style={{color:'#f87171',fontSize:13,fontWeight:500}}>{critical} Critical ticket{critical>1?'s':''} need attention</span>

      <StatCard label="Open Tickets" value={open} icon="🎫" color="blue" sub={`${inprog} in progress`}/>
      <StatCard label="Resolved" value={resolved} icon="✅" color="green" sub="All time"/>
      <StatCard label="Devices Assigned" value={assigned} icon="💻" color="purple" sub={`${available} available`}/>
      <StatCard label="Warranty Expiring" value={expiring} icon="⚠️" color="gold" sub="Within 3 months"/>
    </div>
    {/* Change gridTemplateColumns to '1fr 1fr' for equal sizing */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}> 
      <div className="card" style={{padding:20}}> 
        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Ticket Status Distribution</p> 
        <DonutChart data={[ 
          {label:'Open',value:open,color:'var(--accent)'}, 
          {label:'In Progress',value:inprog,color:'var(--gold)'}, 
          {label:'Resolved',value:resolved,color:'var(--green)'}, 
        ]}/> 
      </div> 
      <div className="card" style={{padding:20}}> 
        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Device Status</p> 
        <DonutChart data={[ 
          {label:'Assigned',value:assigned,color:'var(--purple)'}, 
          {label:'Available',value:available,color:'var(--accent)'}, 
          {label:'Under Repair',value:devices.filter(d=>d.status==='Under Repair').length,color:'var(--orange)'}, 
        ]}/> 
      </div> 
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:24}}>
      <div className="card" style={{padding:20}}>
        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Tickets by Category</p>
        <BarChart data={categoryData.slice(0,6)} colors={['var(--accent)','var(--gold)','var(--green)','var(--purple)','var(--orange)','var(--red)']}/>

        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Resolutions by Admin</p>

            return <div key={t} className="flex-between" style={{fontSize:13}}>
              <span style={{color:'var(--text2)'}}>{t}</span>
              <span style={{fontWeight:500}}>{cnt}</span>
            </div>;
          })}
        </div>
      </div>
    </div>
  </div>;
}

// ─── ADMIN TICKETS ───────────────────────────────────────────────
function AdminTickets({data,currentUser,onSave}){
  const[filter,setFilter]=useState('All');
  const[search,setSearch]=useState('');
  const[selected,setSelected]=useState(null);
  const allUsers=[...data.users,...data.admins];
  const filtered=data.tickets.filter(t=>{
    const matchStatus=filter==='All'||t.status===filter;
    const matchSearch=!search||t.title.toLowerCase().includes(search.toLowerCase())||t.id.includes(search.toUpperCase());
    return matchStatus&&matchSearch;
  }).sort((a,b)=>new Date(b.raisedDate)-new Date(a.raisedDate));
  const priIcon={Critical:'🔴',High:'🟠',Medium:'🟡',Low:'🟢'};
  return <div>
    <div className="topbar"><div><div className="section-head">All Tickets</div><div className="section-sub">Manage and resolve support tickets across all branches</div></div></div>
    <div className="flex-between" style={{marginBottom:16,flexWrap:'wrap',gap:12}}>
      <div style={{display:'flex',gap:8}}>
        {['All','Open','In Progress','Resolved'].map(s=><button key={s} className={`btn ${filter===s?'btn-primary':'btn-ghost'}`} style={{fontSize:12,padding:'7px 14px'}} onClick={()=>setFilter(s)}>{s}</button>)}
      </div>
      <div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input className="search-inp" placeholder="Search tickets..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
    </div>
    {filtered.length===0&&<div className="empty-state card" style={{padding:60}}><div className="icon">🎫</div><h3>No tickets found</h3><p>Try adjusting your filters</p></div>}
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {filtered.map(t=>{
        const u=allUsers.find(x=>x.id===t.raisedBy);
        const dev=data.devices.find(d=>d.id===t.device);
        const branch=data.company.branches.find(b=>b.id===t.branch);
        return <div key={t.id} className="ticket-row" onClick={()=>setSelected(t)}>
          <div style={{flex:1,minWidth:0}}>
            <div className="flex-gap" style={{marginBottom:4}}>
              <span style={{fontSize:14}}>{priIcon[t.priority]}</span>
              <p style={{fontWeight:500,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.title}</p>
            </div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
              {u&&<span style={{fontSize:12,color:'var(--text2)',display:'flex',alignItems:'center',gap:4}}>{u.bitmoji} {u.name}</span>}
              {dev&&<span style={{fontSize:11,color:'var(--text3)'}}>• {dev.name}</span>}
              {branch&&<span style={{fontSize:11,color:'var(--text3)'}}>• {branch.name}</span>}
              <span style={{fontSize:11,color:'var(--text3)'}}>• {fmtDate(t.raisedDate)}</span>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
            <span className={`tag tag-${t.status.toLowerCase().replace(' ','-')}`}>{t.status}</span>
            <span className="chip">#{t.id}</span>
          </div>
        </div>;
      })}
    </div>
    {selected && (
      <TicketModal 
        data={data} 
        ticket={selected} 
        currentUser={currentUser} 
        onSave={d => {
          onSave(d);
          const freshlyUpdatedTicket = d.tickets.find(t => t.id === selected.id);
          setSelected(freshlyUpdatedTicket);
        }} 
        onClose={() => setSelected(null)}
      />
    )}
  </div>;
}

// ─── ADMIN DEVICES ───────────────────────────────────────────────
function AdminDevices({data,currentUser,onSave}){
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('All');
  const[showAdd,setShowAdd]=useState(false);
  const[editing,setEditing]=useState(null);

      <div className="table-wrap">

                </td>
                <td><code style={{fontSize:11,background:'var(--surface2)',padding:'2px 6px',borderRadius:4,color:'var(--accent)'}}>{d.serial}</code></td>

                <td style={{fontSize:12,color:'var(--text2)'}}>{branch?.name||'—'}</td>
                <td>{assignee?<div className="flex-gap"><div className="avatar avatar-sm">{assignee.bitmoji}</div><div><p style={{fontSize:12,fontWeight:500}}>{assignee.name}</p><p style={{fontSize:10,color:'var(--text3)'}}>{assignee.department}</p></div></div>:<span style={{color:'var(--text3)',fontSize:12}}>Unassigned</span>}</td>
                <td><span className={`tag ${d.status==='Available'?'tag-resolved':d.status==='Assigned'?'tag-open':d.status==='Under Repair'?'tag-progress':'tag-critical'}`}>{d.status}</span></td>
                <td>
                  {d.warranty?<span style={{fontSize:12,color:expired?'var(--red)':expSoon?'var(--gold)':'var(--green)'}}>{expired?'⚠ Expired':expSoon?'⚡ Soon':fmtDate(d.warranty)}</span>:<span style={{color:'var(--text3)',fontSize:12}}>—</span>}
                </td>
                <td>
                  <div style={{display:'flex',gap:6}} onClick={(e) => e.stopPropagation()}>
                    <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>setAssigning(d)}>🔗</button>
                    <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>setViewHistory(d)}>📋</button>
                    <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>setEditing(d)}>✏️</button>

              const u=allUsers.find(x=>x.id===h.user);
              return <div key={i} className="timeline-item">
                <div className="timeline-dot" style={{background:h.to?'var(--surface3)':'var(--accent)',color:h.to?'var(--text3)':'#fff'}}>{i+1}</div>
                <div style={{flex:1}}>
                  <div className="flex-gap" style={{marginBottom:4}}>
                    <div className="avatar avatar-sm">{u?.bitmoji||'?'}</div>
                    <div>
                      <p style={{fontSize:13,fontWeight:500}}>{u?.name||'Unknown'}</p>
                      <p style={{fontSize:11,color:'var(--text3)'}}>{u?.department}</p>
                    </div>
                  </div>
                  <div className="flex-gap" style={{fontSize:12,color:'var(--text2)'}}>

// ─── ADMIN USERS ─────────────────────────────────────────────────
function AdminUsers({data,currentUser,onSave}){
  const[tab,setTab]=useState('users'); 
  const[showAdd,setShowAdd]=useState(false); 
  const[editingUser,setEditingUser]=useState(null); 
  const[search,setSearch]=useState(''); 
  const[confirm,setConfirm]=useState(null);
  const [viewingUser, setViewingUser] = useState(null);
  const list=tab==='users'?data.users:data.admins;
  const filtered=list.filter(u=>!search||u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase()));
  const toggleActive=(id,isAdmin)=>{
    if(isAdmin){const admins=data.admins.map(a=>a.id===id?{...a,active:!a.active}:a);onSave({...data,admins});}
    else{const users=data.users.map(u=>u.id===id?{...u,active:!u.active}:u);onSave({...data,users});}
    toast('User status updated.');
  };
  const deleteUser = (id, isAdmin) => {
    setConfirm({
      msg: 'Delete this user permanently?',
      ok: async () => {
        // 1. Instantly clear it from Supabase cloud rows first
        await deleteRecordFromCloud('users', 'user_id', id);
        
        // 2. Then update the frontend display array state
        if (isAdmin) {
          onSave({ ...data, admins: data.admins.filter(a => a.id !== id) });
        } else {
          onSave({ ...data, users: data.users.filter(u => u.id !== id) });
        }
        
        toast('User permanently deleted from cloud database.');
        setConfirm(null);
      }
    });
  };
  const getBranch=id=>data.company.branches.find(b=>b.id===id)?.name||'—';
  return <div>
    <div className="topbar">
      <div><div className="section-head">User Management</div><div className="section-sub">Manage users and admins across all branches</div></div>
      <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>+ Add {tab==='users'?'User':'Admin'}</button>
    </div>
    <div className="flex-between" style={{marginBottom:16}}>
      <div style={{display:'flex',gap:8}}>
        <button className={`btn ${tab==='users'?'btn-primary':'btn-ghost'}`} onClick={()=>setTab('users')}>👤 Users ({data.users.length})</button>
        <button className={`btn ${tab==='admins'?'btn-gold':'btn-ghost'}`} onClick={()=>setTab('admins')}>🦸 Admins ({data.admins.length})</button>
      </div>
      <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-inp" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
    </div>
    <div className="card" style={{overflow:'hidden'}}>
      <div className="table-wrap">
        <table>
          <thead><tr><th>User</th><th>Contact</th><th>Department</th><th>Branch</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.map(u=><tr key={u.id} onClick={() => setViewingUser(u)} style={{ cursor: 'pointer' }}>
              <td>
                <div className="flex-gap">
                  <div className="avatar">{u.bitmoji||'😀'}</div>
                  <div>
                    <p style={{fontWeight:500,fontSize:13}}>{u.name}</p>
                    <p style={{fontSize:11,color:'var(--text3)'}}>{u.designation||u.role} • {u.employeeId||'—'}</p>
                  </div>
                </div>
              </td>
              <td>
                <p style={{fontSize:12}}>{u.email}</p>
                <p style={{fontSize:11,color:'var(--text3)'}}>{u.phone||'—'}</p>
              </td>
              <td style={{fontSize:13,color:'var(--text2)'}}>{u.department||'—'}</td>
              <td style={{fontSize:12,color:'var(--text2)'}}>{getBranch(u.branch)}</td>
              <td style={{fontSize:12,color:'var(--text2)'}}>{fmtDate(u.doj)}</td>
              <td><span className={`tag ${u.active?'tag-resolved':'tag-critical'}`}>{u.active?'Active':'Inactive'}</span></td>
              <td><div style={{display:'flex',gap:6}}>
                <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>toggleActive(u.id,tab==='admins')}>{u.active?'Deactivate':'Activate'}</button>
                <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:11}} onClick={()=>setEditingUser(u)}>✏️</button>
                <button className="btn btn-danger" style={{padding:'5px 10px',fontSize:11}} onClick={()=>deleteUser(u.id,tab==='admins')}>🗑</button>
              </div></td>
            </tr>)}
          </tbody>
        </table>
        {filtered.length===0&&<div className="empty-state" style={{padding:40}}><div>👥</div><p>No users found.</p></div>}
      </div>
    </div>
    {showAdd&&<AddUserModal data={data} type={tab==='admins'?'admin':'user'} onSave={d=>{onSave(d);setShowAdd(false);}} onClose={()=>setShowAdd(false)}/>}
    {editingUser&&<AddUserModal data={data} type={tab==='admins'?'admin':'user'} user={editingUser} onSave={d=>{onSave(d);setEditingUser(null);}} onClose={()=>setEditingUser(null)}/>}
    {confirm&&<ConfirmModal msg={confirm.msg} onOk={confirm.ok} onCancel={()=>setConfirm(null)}/>}
    {viewingUser && <ViewUserModal user={viewingUser} onClose={() => setViewingUser(null)} />}
  </div>;
}

// ─── ADMIN REPORTS ───────────────────────────────────────────────
function AdminReports({data}){
  const tickets=data.tickets;
  const devices=data.devices;
  const warrantyExpired=devices.filter(d=>d.warranty&&new Date(d.warranty)<new Date());
  const warrantyExpiring=devices.filter(d=>{if(!d.warranty)return false;const diff=(new Date(d.warranty)-new Date())/(1000*60*60*24*30);return diff>0&&diff<3;});
  const totalValue=devices.reduce((s,d)=>s+(Number(d.price)||0),0);
  const resolvedPct=tickets.length?Math.round((tickets.filter(t=>t.status==='Resolved').length/tickets.length)*100):0;
  return <div>
    <div className="topbar"><div><div className="section-head">Reports & Analytics</div><div className="section-sub">Comprehensive insights across your service inventory</div></div></div>
    <div className="grid-4" style={{marginBottom:24}}>
      <StatCard label="Total Tickets" value={tickets.length} icon="🎫" color="blue"/>
      <StatCard label="Resolution Rate" value={`${resolvedPct}%`} icon="📈" color="green"/>
      <StatCard label="Fleet Value" value={`₹${(totalValue/100000).toFixed(1)}L`} icon="💰" color="gold"/>
      <StatCard label="Warranty Alerts" value={warrantyExpired.length+warrantyExpiring.length} icon="⚠️" color="red"/>
    </div>
    <div className="grid-2" style={{marginBottom:24}}>
      <div className="card" style={{padding:20}}>
        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>⚠️ Warranty Alerts</p>
        {[...warrantyExpired.map(d=>({...d,_alert:'expired'})),...warrantyExpiring.map(d=>({...d,_alert:'soon'}))].length===0&&<div className="empty-state"><div>✅</div><p>All warranties are valid.</p></div>}
        {[...warrantyExpired.map(d=>({...d,_alert:'expired'})),...warrantyExpiring.map(d=>({...d,_alert:'soon'}))].map(d=><div key={d.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
          <span style={{fontSize:24}}>{'💻'}</span>
          <div style={{flex:1}}>
            <p style={{fontSize:13,fontWeight:500}}>{d.name}</p>
            <p style={{fontSize:11,color:'var(--text3)'}}>Warranty: {fmtDate(d.warranty)}</p>
          </div>
          <span style={{fontSize:12,fontWeight:600,color:d._alert==='expired'?'var(--red)':'var(--gold)'}}>{d._alert==='expired'?'EXPIRED':'EXPIRING'}</span>
        </div>)}
      </div>
      <div className="card" style={{padding:20}}>
        <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>📦 Inventory Summary</p>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {DEVICE_TYPES.map(t=>{
            const devs=devices.filter(d=>d.type===t);

            const avail=devs.filter(d=>d.status==='Available').length;
            const value=devs.reduce((s,d)=>s+(Number(d.price)||0),0);
            return <div key={t} className="flex-between" style={{padding:'8px 12px',background:'var(--surface2)',borderRadius:'var(--r2)'}}>

            </div>;
          })}
        </div>
      </div>
    </div>
  </div>;
}

// ─── USER TICKETS ────────────────────────────────────────────────
function UserTickets({data,currentUser,onSave}){
  const[showNew,setShowNew]=useState(false);
  const[selected,setSelected]=useState(null);
  const[filter,setFilter]=useState('All');
  const myTickets=data.tickets.filter(t=>t.raisedBy===currentUser.id);
  const filtered=myTickets.filter(t=>filter==='All'||t.status===filter).sort((a,b)=>new Date(b.raisedDate)-new Date(a.raisedDate));
  const allUsers=[...data.users,...data.admins];
  const priIcon={Critical:'🔴',High:'🟠',Medium:'🟡',Low:'🟢'};
  return <div>
    <div className="topbar">
      <div><div className="section-head">My Tickets</div><div className="section-sub">Track and manage your support requests</div></div>
      <button className="btn btn-primary" onClick={()=>setShowNew(true)}>+ New Ticket</button>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      {['All','Open','In Progress','Resolved'].map(s=><button key={s} className={`btn ${filter===s?'btn-primary':'btn-ghost'}`} style={{fontSize:12,padding:'7px 14px'}} onClick={()=>setFilter(s)}>{s} ({s==='All'?myTickets.length:myTickets.filter(t=>t.status===s).length})</button>)}
    </div>
    {filtered.length===0&&<div className="empty-state card" style={{padding:60}}><div className="icon">🎫</div><h3>No tickets found</h3><p>Click "New Ticket" to raise an issue</p></div>}
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {filtered.map(t=>{
        const dev=data.devices.find(d=>d.id===t.device);
        const resolver=t.resolvedBy?allUsers.find(u=>u.id===t.resolvedBy):null;
        return <div key={t.id} className="ticket-row" onClick={()=>setSelected(t)}>
          <div style={{flex:1,minWidth:0}}>
            <div className="flex-gap" style={{marginBottom:6}}>
              <span>{priIcon[t.priority]}</span>
              <p style={{fontWeight:500,fontSize:14,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t.title}</p>
              <span className="chip" style={{flexShrink:0}}>#{t.id}</span>
            </div>
            <div style={{display:'flex',gap:12,fontSize:12,color:'var(--text2)',flexWrap:'wrap'}}>
              <span>📂 {t.category}</span>
              {dev&&<span>💻 {dev.name}</span>}
              <span>📅 {fmtDate(t.raisedDate)}</span>
              {resolver&&<span>✅ Resolved by {resolver.name} • {fmtDate(t.resolvedDate)}</span>}
              {t.comments.length>0&&<span>💬 {t.comments.length} comment{t.comments.length>1?'s':''}</span>}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
            <span className={`tag tag-${t.status.toLowerCase().replace(' ','-')}`}>{t.status}</span>
            <span className={`tag tag-${t.priority.toLowerCase()}`}>{t.priority}</span>
          </div>
        </div>;
      })}
    </div>
    {showNew&&<NewTicketModal data={data} currentUser={currentUser} onSave={d=>{onSave(d);setShowNew(false);}} onClose={()=>setShowNew(false)}/>}
    {selected && (
      <TicketModal 
        data={data} 
        ticket={selected} 
        currentUser={currentUser} 
        onSave={d => {
          onSave(d);
          const freshlyUpdatedTicket = d.tickets.find(t => t.id === selected.id);
          setSelected(freshlyUpdatedTicket || null);
        }} 
        onClose={() => setSelected(null)}
      />
    )}
  </div>;
}

// ─── NEW ASSET ALLOCATION REQUEST MODAL ─────────────────────────
function NewAssetRequestModal({data, currentUser, onSave, onClose}){
  const [form, setForm] = useState({
    assetType: 'Laptop',
    priority: 'Medium',
    justification: ''
  });

  const handleSubmit = () => {
    if (!form.justification.trim()) {
      toast('Please provide a business justification for the asset.', 'error');
      return;
    }

    const id = 'REQ' + Math.random().toString(36).slice(2, 9).toUpperCase();
    
    // Construct request payload structured safely for your Supabase ticket pipeline
    const assetTicket = {
      id: id,
      title: `Asset Request: New ${form.assetType} Allocation`,
      category: 'Asset Allocation Request',
      priority: form.priority,
      status: 'Open',
      description: `Requested Asset Category: ${form.assetType}\n\nBusiness Justification:\n${form.justification}`,
      raisedBy: currentUser.id,
      raisedDate: new Date().toISOString(),
      device: null,
      resolvedBy: null,
      resolvedDate: null,
      resolutionNote: null,
      comments: [],
      branch: currentUser.branch || 'BR001'
    };

    onSave({
      ...data,
      tickets: [...data.tickets, assetTicket]
    });

    toast('Asset request submitted to IT Admin successfully! 🚀');
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal modal-lg" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2 style={{fontFamily:'var(--font-head)', fontSize:20, fontWeight:700}}>🚀 Request New Asset Allocation</h2>
        </div>
        <div className="modal-body">
          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            <div className="grid-2">
              <div>
                <label className="lbl">Required Asset Type</label>
                <select className="inp" value={form.assetType} onChange={e => setForm({...form, assetType: e.target.value})}>
                  {DEVICE_TYPES.map(t => <option key={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <label className="lbl">Urgency / Priority</label>
                <select className="inp" value={form.priority} onChange={e => setForm({...form, priority: e.target.value})}>
                  {PRIORITIES.map(p => <option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="lbl">Business Justification & Requirements *</label>
              <textarea 
                className="inp inp-area" 
                style={{minHeight: 140}} 
                value={form.justification} 
                onChange={e => setForm({...form, justification: e.target.value})} 
                placeholder="Please describe why this asset is needed, preferred specs, or special software dependencies..."
              />
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSubmit}>Submit Request</button>
        </div>
      </div>
    </div>
  );
}

// ─── PROFILE ─────────────────────────────────────────────────────
function Profile({data,currentUser,onSave}){
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({...currentUser});
  const[changePw,setChangePw]=useState(false);
  const[newPw,setNewPw]=useState({old:'',new1:'',new2:''});
  const save=()=>{
    const isAdmin=currentUser.role==='admin';
    if(isAdmin){const admins=data.admins.map(a=>a.id===currentUser.id?{...a,...form}:a);onSave({...data,admins},form);}
    else{const users=data.users.map(u=>u.id===currentUser.id?{...u,...form}:u);onSave({...data,users},form);}
    toast('Profile updated!');setEditing(false);
  };
  const savePw=()=>{
    if(newPw.old!==currentUser.password){toast('Incorrect current password.','error');return;}
    if(newPw.new1!==newPw.new2){toast('New passwords do not match.','error');return;}
    if(newPw.new1.length<6){toast('Password must be at least 6 characters.','error');return;}
    const isAdmin=currentUser.role==='admin';
    if(isAdmin){const admins=data.admins.map(a=>a.id===currentUser.id?{...a,password:newPw.new1}:a);onSave({...data,admins},{...currentUser,password:newPw.new1});}
    else{const users=data.users.map(u=>u.id===currentUser.id?{...u,password:newPw.new1}:u);onSave({...data,users},{...currentUser,password:newPw.new1});}
    toast('Password changed!');setChangePw(false);setNewPw({old:'',new1:'',new2:''});
  };
  const f=v=>setForm(p=>({...p,...v}));
  const branch=data.company.branches.find(b=>b.id===currentUser.branch);
  return <div>
    <div className="topbar"><div><div className="section-head">My Profile</div><div className="section-sub">Manage your personal information and settings</div></div>
      <button className="btn btn-primary" onClick={()=>editing?save():setEditing(true)}>{editing?'Save Changes':'Edit Profile'}</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'240px 1fr',gap:20}}>
      <div className="card" style={{padding:24,textAlign:'center',height:'fit-content'}}>
        <div className="avatar avatar-lg" style={{margin:'0 auto 14px'}}>{editing?form.bitmoji:currentUser.bitmoji}</div>
        <p style={{fontWeight:700,fontSize:16,fontFamily:'var(--font-head)'}}>{currentUser.name}</p>
        <p style={{fontSize:12,color:'var(--text3)',marginTop:4}}>{currentUser.designation}</p>
        <p style={{fontSize:11,color:'var(--text3)'}}>{currentUser.department}</p>
        <hr className="divider"/>
        <span className={`tag ${currentUser.role==='admin'?'tag-progress':'tag-open'}`}>{currentUser.role==='admin'?'Administrator':'Team Member'}</span>
        <div style={{marginTop:16,fontSize:12,color:'var(--text3)',lineHeight:1.8}}>
          <p>📧 {currentUser.email}</p>
          <p>📱 {currentUser.phone||'—'}</p>
          <p>🏢 {branch?.name||'—'}</p>
          <p>📅 {fmtDate(currentUser.doj)}</p>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <div className="card" style={{padding:24}}>
          <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Personal Information</p>
          {editing?<div className="flex-col">
            <div className="grid-2">
              <div><label className="lbl">Full Name</label><input className="inp" value={form.name} onChange={e=>f({name:e.target.value})}/></div>
              <div><label className="lbl">Phone</label><input className="inp" value={form.phone||''} onChange={e=>f({phone:e.target.value})}/></div>
              <div><label className="lbl">Department</label><input className="inp" value={form.department||''} onChange={e=>f({department:e.target.value})}/></div>
              <div><label className="lbl">Designation</label><input className="inp" value={form.designation||''} onChange={e=>f({designation:e.target.value})}/></div>
            </div>
            <BitmojiPicker selected={form.bitmoji} onSelect={b=>f({bitmoji:b})}/>
            <div style={{display:'flex',gap:8}}><button className="btn btn-primary" onClick={save}>Save</button><button className="btn btn-ghost" onClick={()=>setEditing(false)}>Cancel</button></div>
          </div>:<div className="grid-2">
            {[['Name',currentUser.name],['Email',currentUser.email],['Phone',currentUser.phone||'—'],['Department',currentUser.department||'—'],['Designation',currentUser.designation||'—'],['Employee ID',currentUser.employeeId||'—'],['Date of Joining',fmtDate(currentUser.doj)],['Branch',branch?.name||'—']].map(([k,v])=><div key={k}>
              <p style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:4}}>{k}</p>
              <p style={{fontSize:14,fontWeight:500}}>{v}</p>
            </div>)}
          </div>}
        </div>
        <div className="card" style={{padding:24}}>
          <div className="flex-between" style={{marginBottom:16}}>
            <p style={{fontFamily:'var(--font-head)',fontWeight:700}}>Security</p>
            <button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>setChangePw(!changePw)}>🔑 Change Password</button>
          </div>
          {changePw&&<div className="flex-col">
            <div><label className="lbl">Current Password</label><input className="inp" type="password" value={newPw.old} onChange={e=>setNewPw({...newPw,old:e.target.value})}/></div>
            <div><label className="lbl">New Password</label><input className="inp" type="password" value={newPw.new1} onChange={e=>setNewPw({...newPw,new1:e.target.value})}/></div>
            <div><label className="lbl">Confirm New Password</label><input className="inp" type="password" value={newPw.new2} onChange={e=>setNewPw({...newPw,new2:e.target.value})}/></div>
            <div style={{display:'flex',gap:8}}><button className="btn btn-primary" onClick={savePw}>Update Password</button><button className="btn btn-ghost" onClick={()=>setChangePw(false)}>Cancel</button></div>
          </div>}
          {!changePw&&<div style={{background:'var(--surface2)',borderRadius:'var(--r2)',padding:'12px 14px',fontSize:13,color:'var(--text2)'}}>
            🔐 Password last changed: Unknown • Keep your password secure and unique.
          </div>}
        </div>
      </div>
    </div>
  </div>;
}

function CompanySettings({data,onSave}){
  const[name,setName]=useState(data.company.name);
  const save=()=>{onSave({...data,company:{...data.company,name}});toast('Company settings saved!');};
  return <div>
    <div className="topbar"><div><div className="section-head">Company Settings</div><div className="section-sub">Configure your organization details</div></div></div>
    <div className="card" style={{padding:28,maxWidth:500}}>
      <p style={{fontFamily:'var(--font-head)',fontWeight:700,marginBottom:16}}>Organization Info</p>
      <div className="flex-col">
        <div><label className="lbl">Company Name</label><input className="inp" value={name} onChange={e=>setName(e.target.value)}/></div>
        <button className="btn btn-primary" style={{alignSelf:'flex-start'}} onClick={save}>Save Settings</button>
      </div>
    </div>
  </div>;
}

// ─── ADMIN APP ───────────────────────────────────────────────────
function AdminApp({data,currentUser,onSave,onLogout,updateCurrentUser}){
  const[page,setPage]=useState('dashboard');
  const openTickets=data.tickets.filter(t=>t.status!=='Resolved').length;
  const navItems=[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'tickets',icon:'🎫',label:'Tickets',badge:openTickets||null},
    {id:'devices',icon:'📦',label:'Devices'},
    {id:'users',icon:'👥',label:'Users & Admins'},
    {id:'branches',icon:'🌍',label:'Branches'},
    {id:'reports',icon:'📈',label:'Reports'},
    {id:'divider'},
    {id:'settings',icon:'⚙️',label:'Company Settings'},
    {id:'profile',icon:'👤',label:'My Profile'},
  ];
  
  const pages={
    dashboard:<AdminDashboard data={data} currentUser={currentUser}/>,
    tickets:<AdminTickets data={data} currentUser={currentUser} onSave={onSave}/>,
    devices:<AdminDevices data={data} currentUser={currentUser} onSave={onSave}/>,
    users:<AdminUsers data={data} currentUser={currentUser} onSave={onSave}/>,
    branches:<AdminBranches data={data} onSave={onSave}/>,
    reports:<AdminReports data={data}/>,
    settings:<CompanySettings data={data} onSave={onSave}/>,
    profile:<Profile data={data} currentUser={currentUser} onSave={onSave}/>,
  };
  return <div style={{display:'flex',width:'100%',minHeight:'100vh'}}>
    <Sidebar user={currentUser} items={navItems} active={page} onChange={setPage} onLogout={onLogout}/>
    <div className="main-area animate-in">{pages[page]||pages.dashboard}</div>
  </div>;
}

// ─── USER APP ────────────────────────────────────────────────────
function UserApp({data,currentUser,onSave,onLogout,updateCurrentUser}){
  const[page,setPage]=useState('dashboard');
  const myOpen=data.tickets.filter(t=>t.raisedBy===currentUser.id&&t.status!=='Resolved').length;
  const navItems=[
    {id:'dashboard',icon:'🏠',label:'Dashboard'},
    {id:'tickets',icon:'🎫',label:'My Tickets',badge:myOpen||null},
    {id:'devices',icon:'💻',label:'My Devices'},
    {id:'divider'},
    {id:'profile',icon:'👤',label:'My Profile'},
  ];
  const handleSave=(d,updatedUser)=>{onSave(d);if(updatedUser)updateCurrentUser(updatedUser);};
  const pages={
    dashboard:<UserDashboard data={data} currentUser={currentUser}/>,
    tickets:<UserTickets data={data} currentUser={currentUser} onSave={onSave}/>,
    devices: <UserDevices data={data} currentUser={currentUser} onSave={onSave}/>,
    profile:<Profile data={data} currentUser={currentUser} onSave={handleSave}/>,
  };
  return <div style={{display:'flex',width:'100%',minHeight:'100vh'}}>
    <Sidebar user={currentUser} items={navItems} active={page} onChange={setPage} onLogout={onLogout}/>
    <div className="main-area animate-in">{pages[page]||pages.dashboard}</div>
  </div>;
}

// ─── ROOT APP ────────────────────────────────────────────────────
function App(){
  const [data, setData] = useState(INITIAL_DATA);
  const [screen, setScreen] = useState('landing');
  const [currentUser, setCurrentUser] = useState(null);

  // Live Cloud Mount Lifecycle Hook
  useEffect(() => {
    async function initializeDb() {
      const cloudData = await loadDataFromCloud();
      setData(cloudData);
    }
    initializeDb();
  }, []);

  const handleSave = useCallback(async (newData) => {
    // 1. Detect missing users/admins and instantly purge them from Supabase
    if (data.users && newData.users) {
      const removedUsers = data.users.filter(oldU => !newData.users.some(newU => newU.id === oldU.id));
      for (const u of removedUsers) {
        await deleteRecordFromCloud('users', 'user_id', u.id);
      }
    }
    if (data.admins && newData.admins) {
      const removedAdmins = data.admins.filter(oldA => !newData.admins.some(newA => newA.id === oldA.id));
      for (const a of removedAdmins) {
        await deleteRecordFromCloud('users', 'user_id', a.id);
      }
    }

    // 2. Update the frontend UI layout instantly
    setData(newData);
    
    try {
      // 2. Safely sync your multi-branch configurations
      if (newData.company?.branches) {
        for (const b of newData.company.branches) {
          await saveRecordToCloud('branches', {
            branch_id: b.id,
            name: b.name,
            country: b.country || '',
            state: b.state || ''
          });
        }
      }

      // 3. Sync all Users and Admins back to the primary authentication table
      const allUsers = [...(newData.users || []), ...(newData.admins || [])];
      for (const u of allUsers) {
        await saveRecordToCloud('users', {
          user_id: u.id,
          branch_id: u.branch || 'BR001',
          name: u.name,
          email: u.email,
          password_hash: u.password || 'user123',
          role: u.role || 'user',
          bitmoji: u.bitmoji || '😀',
          department: u.department || '',
          designation: u.designation || '',
          doj: u.doj || null,
          phone: u.phone || '',
          employee_id: u.employeeId || '',
          is_active: u.active !== false
        });
      }

      // 4. Sync your current Device Hardware Asset parameters
      if (newData.devices) {
        for (const d of newData.devices) {
          await saveRecordToCloud('devices', {
            device_id: d.id,
            branch_id: d.branch || 'BR001',
            assigned_to: d.assignedTo || null,
            name: d.name,
            type: d.type || 'Laptop',
            brand: d.brand || '',
            model: d.model || '',
            serial: d.serial,
            color: d.color || '',
            buy_date: d.buyDate || null,
            warranty_expiry: d.warranty || null,
            warranty_card: d.warrantyCard || '',
            status: d.status || 'Available',
            price: Number(d.price) || 0
          });
        }
      }

      // 5. Sync your Support Tickets status pipelines and comments
      if (newData.tickets) {
        for (const t of newData.tickets) {
          await saveRecordToCloud('tickets', {
            ticket_id: t.id,
            raised_by: t.raisedBy,
            device_id: t.device || null, // Verified Variable Fix
            resolved_by: t.resolvedBy || null,
            branch_id: t.branch || 'BR001',
            title: t.title,
            category: t.category || 'Other',
            priority: t.priority || 'Medium',
            status: t.status || 'Open',
            description: t.description || '',
            raised_date: t.raisedDate || new Date().toISOString(),
            resolved_date: t.resolvedDate || null,
            resolution_note: t.resolutionNote || null
          });

          // Actively stream comments straight to the dedicated comment tracking table
          if (t.comments) {
            for (const c of t.comments) {
              const uniqueCommentId = t.id + '_' + new Date(c.date).getTime();
              await saveRecordToCloud('ticket_comments', {
                id: uniqueCommentId,
                ticket_id: t.id,
                by_user_id: c.by,
                comment_text: c.text,
                created_at: c.date
              });
            }
          }
        }
      }
    } catch (err) {
      console.error("Cloud tracking sync error failed:", err);
    }
  }, [data]);

  const updateCurrentUser = useCallback(u => setCurrentUser(u), []);

  const handleLogout = () => {
    setCurrentUser(null);
    setScreen('landing');
    toast('Logged out successfully.');
  };

  const handleLogin = u => {
    setCurrentUser(u);
    setScreen('app');
  };

  if (screen === 'landing') return <>
    <ThemeToggle />
    <LandingPage onEnter={mode => setScreen(`auth-${mode}`)}/>
    <Toast/>
  </>;

  if (screen === 'auth-admin') return <>
    <ThemeToggle />
    <AuthPage mode="admin" data={data} onLogin={handleLogin}/>
    <button onClick={() => setScreen('landing')} style={{position:'fixed',top:20,left:20,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--r2)',padding:'8px 14px',cursor:'pointer',color:'var(--text2)',fontSize:13}}>← Back</button>
    <Toast/>
  </>;

  if (screen === 'auth-user') return <>
    <ThemeToggle />
    <AuthPage mode="user" data={data} onLogin={handleLogin}/>
    <button onClick={() => setScreen('landing')} style={{position:'fixed',top:20,left:20,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--r2)',padding:'8px 14px',cursor:'pointer',color:'var(--text2)',fontSize:13}}>← Back</button>
    <Toast/>
  </>;

  if (screen === 'app' && currentUser) {
    if (currentUser.role === 'admin') return <>
      <ThemeToggle />
      <AdminApp data={data} currentUser={currentUser} onSave={handleSave} onLogout={handleLogout} updateCurrentUser={updateCurrentUser}/>
      <Toast/>
    </>;
    return <>
      <ThemeToggle />
      <UserApp data={data} currentUser={currentUser} onSave={handleSave} onLogout={handleLogout} updateCurrentUser={updateCurrentUser}/>
      <Toast/>
    </>;
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
